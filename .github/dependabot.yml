version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /engine
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /cli
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /engine/ui
    target-branch: dev
    schedule:
      interval: weekly
