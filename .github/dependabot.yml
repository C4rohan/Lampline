version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /engine
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /cli
    target-branch: dev
    schedule:
      interval: weekly
  # One pull request a week for all engine UI packages: React and its type
  # packages have to move together, and every UI update needs the committed
  # build (engine/src/vpengine/static) rebuilt once before CI passes.
  - package-ecosystem: npm
    directory: /engine/ui
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      engine-ui:
        patterns: ["*"]
