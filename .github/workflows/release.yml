name: release

# Every push to prod releases the version in VERSION, unless that version is already tagged:
# it tags the commit and publishes a GitHub release with notes built from the merged pull requests.
# So a release starts on dev, with `scripts/version.sh set X.Y.Z`; merging that into prod ships it.
# Run by hand too (Actions → release → Run workflow) to release prod as it is now.
# It also publishes the vk CLI to PyPI as `lampline` (pipx install lampline) whenever that version isn't there yet.

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      pypi: ${{ steps.release.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
      - name: Tag and publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/version.sh check
          version="v$(scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$version is already released; bump VERSION on dev (scripts/version.sh set X.Y.Z) for the next one."
          else
            gh release create "$version" -R "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
              --title "$version" --generate-notes
            echo "Released $version" >> "$GITHUB_STEP_SUMMARY"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          # PyPI is checked on its own, so a publish that failed (or was skipped) is retried by any later run.
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/lampline/${version#v}/json" || true)
          if [ "$code" = 200 ]; then
            echo "lampline ${version#v} is already on PyPI."
          elif [ "$code" = 404 ]; then
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Couldn't check PyPI (HTTP $code); not publishing this run. Run the workflow again."
          fi

  # The vk CLI on PyPI, as `lampline`. No token is stored: PyPI trusts this workflow
  # (pypi.org → the project's Publishing settings → trusted publisher: owner C4rohan,
  # repository Lampline, workflow release.yml, environment pypi).
  pypi:
    needs: tag
    if: needs.tag.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the package
        run: |
          python -m pip install --quiet build==1.2.2.post1
          python -m build cli --outdir dist
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
      - name: If publishing failed
        if: failure()
        run: |
          echo "PyPI didn't accept the upload. The usual cause: the trusted publisher isn't set up yet." >> "$GITHUB_STEP_SUMMARY"
          echo "On pypi.org: Your account → Publishing → add a publisher for project 'lampline' with owner C4rohan, repository Lampline, workflow release.yml, environment pypi. Then re-run this job." >> "$GITHUB_STEP_SUMMARY"
