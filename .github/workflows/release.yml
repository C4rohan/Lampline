name: release

# Merging a pull request titled "Release vX.Y.Z" into prod tags that commit
# and publishes a GitHub release with notes built from the merged pull requests.

on:
  pull_request:
    branches: [prod]
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version=$(echo "$TITLE" | grep -oE '^Release v[0-9]+\.[0-9]+\.[0-9]+' | cut -d' ' -f2)
          if [ -z "$version" ]; then echo "No version in '$TITLE'; nothing to tag."; exit 0; fi
          if gh release view "$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$version already exists."; exit 0
          fi
          gh release create "$version" -R "$GITHUB_REPOSITORY" --target "$SHA" --title "$version" --generate-notes
