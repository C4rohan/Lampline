[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lampline"
version = "0.5.1"
description = "vk: build, check and test Lampline voice agents from the terminal, CI, or a coding agent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Rohan Salvi" }]
keywords = ["voice-agents", "phone", "ivr", "testing", "dialogflow-cx", "conversational-ai", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/C4rohan/Lampline"
Documentation = "https://github.com/C4rohan/Lampline/blob/prod/cli/README.md"
Issues = "https://github.com/C4rohan/Lampline/issues"
Changelog = "https://github.com/C4rohan/Lampline/blob/prod/CHANGELOG.md"

[project.scripts]
vk = "vk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vk = ["skills/*/SKILL.md", "templates/*/agent.yaml", "templates/*/prompts/*.md", "templates/*/tests/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
